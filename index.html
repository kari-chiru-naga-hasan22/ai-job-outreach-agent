<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Job & Internship Talent Scout — All Engineering Domains</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#080c15',
                            surface: '#0f172a',
                            card: '#141e33',
                            border: '#1e293b',
                            input: '#0b1120'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: #080c15;
            color: #f8fafc;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #1e293b;
        }
        .shimmer {
            background: linear-gradient(90deg, rgba(30,41,59,0.5) 0%, rgba(51,65,85,0.8) 50%, rgba(30,41,59,0.5) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="min-h-screen selection:bg-blue-500 selection:text-white pb-20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DOMAINS = [
            {
                id: "embedded",
                name: "⚡ Embedded & Firmware",
                presets: ["Embedded Systems Intern", "Firmware Engineer", "IoT Systems Intern", "Microcontroller / RTOS Dev"]
            },
            {
                id: "pcb",
                name: "🔌 PCB Design & Hardware",
                presets: ["PCB Design Engineer Intern", "Hardware Design Intern", "Altium Layout Engineer", "Avionics Hardware Intern"]
            },
            {
                id: "ai",
                name: "🧠 AI & Agentic Systems",
                presets: ["AI Engineer Intern", "Agentic AI Engineer", "GenAI Intern", "Machine Learning Intern", "LLM Engineer"]
            },
            {
                id: "vlsi",
                name: "🔬 VLSI, FPGA & Robotics",
                presets: ["VLSI Design Intern", "FPGA Engineer", "Robotics Software Intern", "Semiconductor Trainee"]
            },
            {
                id: "software",
                name: "💻 Full-Stack & Backend",
                presets: ["Full Stack Developer", "Backend Engineer (Python/Go)", "Cloud & DevOps Intern", "Data Engineer"]
            }
        ];

        const CITIES = ["Hyderabad", "Bengaluru", "Pune", "Delhi NCR", "Chennai", "Remote"];

        function App() {
            const [selectedDomain, setSelectedDomain] = useState("embedded");
            const [role, setRole] = useState("Embedded Systems Engineer Intern");
            const [location, setLocation] = useState("Hyderabad");
            const [jobType, setJobType] = useState("Internship");
            const [paidOnly, setPaidOnly] = useState(true);
            const [loading, setLoading] = useState(false);
            const [leads, setLeads] = useState([]);
            const [modelInfo, setModelInfo] = useState({ model_id: "meta-llama/llama-3.3-70b-instruct", api_key_configured: true });
            const [error, setError] = useState(null);
            const [toast, setToast] = useState(null);
            const [searchFilter, setSearchFilter] = useState("");

            useEffect(() => {
                fetch("/api/health")
                    .then(res => res.json())
                    .then(data => setModelInfo(data))
                    .catch(e => console.log(e));

                handleSearch(null, "Embedded Systems Engineer Intern", "Hyderabad", "Internship");
            }, []);

            const showToastMsg = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const handleSearch = async (e, customRole, customLoc, customType) => {
                if (e) e.preventDefault();
                setLoading(true);
                setError(null);

                const targetRole = customRole || role;
                const targetLoc = customLoc || location;
                const targetType = customType || jobType;

                try {
                    const res = await fetch("/api/search", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            role: targetRole,
                            location: targetLoc,
                            job_type: targetType,
                            paid_only: paidOnly
                        })
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.detail || "Search failed");
                    }

                    const data = await res.json();
                    setLeads(data.leads || []);
                    if (data.model_used) {
                        setModelInfo(prev => ({ ...prev, model_id: data.model_used }));
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const copyPitch = (type, comp, roleTitle) => {
                let pitch = "";
                const isPCB = roleTitle.toLowerCase().includes("pcb") || roleTitle.toLowerCase().includes("hardware");
                const isEmbedded = roleTitle.toLowerCase().includes("embedded") || roleTitle.toLowerCase().includes("firmware") || roleTitle.toLowerCase().includes("iot");
                
                if (type === "hr") {
                    pitch = `Hi! I recently applied for the ${roleTitle} opening at ${comp}.\n\nI have strong hands-on experience in ${isPCB ? 'multi-layer PCB design (Altium/KiCad), high-speed routing, and hardware prototyping' : isEmbedded ? 'C/C++ firmware development, microcontroller peripherals (STM32/ESP32), RTOS tasks, and hardware debugging' : 'modern software engineering and AI systems'}.\n\nMy portfolio and resume are attached for quick review. Would love to connect regarding next steps!`;
                } else if (type === "tech") {
                    pitch = `Hi! Saw the cutting-edge engineering work your team is shipping at ${comp}.\n\nI'm a ${isPCB ? 'Hardware & PCB Designer specializing in high-speed stackups, EMI/EMC compliance, and board bring-up' : isEmbedded ? 'Firmware & Embedded Systems Engineer focusing on bare-metal C/C++, RTOS task scheduling, and low-level communication protocols (SPI, I2C, CAN)' : 'Software & AI Engineer building scalable systems'}.\n\nHere is my project portfolio & schematics/code repo: [Link to Portfolio/GitHub]\n\nI'd love 5 minutes to share how I can contribute to your active hardware/firmware sprint this term!`;
                } else {
                    pitch = `Hi! Really admire what you and the founding team are building at ${comp}.\n\nI noticed you are expanding your engineering bench with the ${roleTitle} role. I have extensive practical project experience in ${isPCB ? 'schematic capture, PCB layout, and prototype testing' : isEmbedded ? 'firmware architectures, driver development, and embedded hardware validation' : 'scalable production engineering'}.\n\nWould love to connect and share how I can accelerate your hardware/software deliverables this quarter!`;
                }

                navigator.clipboard.writeText(pitch).then(() => {
                    showToastMsg(`📋 Copied tailored ${type.toUpperCase()} cold pitch template!`);
                });
            };

            const filteredLeads = leads.filter(l => {
                if (!searchFilter) return true;
                const q = searchFilter.toLowerCase();
                return (
                    l.company?.toLowerCase().includes(q) ||
                    l.role?.toLowerCase().includes(q) ||
                    l.paid_source?.toLowerCase().includes(q) ||
                    l.location?.toLowerCase().includes(q)
                );
            });

            return (
                <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-8">
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 bg-emerald-500 text-slate-950 font-bold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm">
                            <span>✨</span> {toast}
                        </div>
                    )}

                    {/* Header */}
                    <header className="mb-6">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-dark-border pb-6">
                            <div>
                                <div className="flex items-center gap-2 text-indigo-400 font-mono text-xs font-semibold uppercase tracking-wider mb-1">
                                    <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                    Universal Engineering & Tech Scout
                                </div>
                                <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-amber-300 via-sky-300 to-indigo-400 bg-clip-text text-transparent">
                                    Universal Job & Internship Finder
                                </h1>
                                <p className="text-slate-400 text-sm mt-1">
                                    Autonomous talent scout across <strong className="text-amber-300">Embedded Systems, PCB Design, Hardware, VLSI, AI, and Software</strong> with verified compensation and executive LinkedIn contacts.
                                </p>
                            </div>

                            <div className="flex items-center gap-2 bg-dark-card border border-dark-border px-3 py-2 rounded-xl text-xs font-mono">
                                <span className="text-slate-400">Agent:</span>
                                <span className="text-indigo-300 font-medium bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/50">
                                    {modelInfo.model_id}
                                </span>
                            </div>
                        </div>
                    </header>

                    {/* Domain Category Selector Tabs */}
                    <div className="flex items-center gap-2 overflow-x-auto pb-2 mb-6 scrollbar-none">
                        {DOMAINS.map(d => (
                            <button
                                key={d.id}
                                onClick={() => {
                                    setSelectedDomain(d.id);
                                    setRole(d.presets[0]);
                                    handleSearch(null, d.presets[0], location, jobType);
                                }}
                                className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 ${
                                    selectedDomain === d.id
                                        ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-500/20 scale-[1.02]'
                                        : 'bg-dark-surface border border-dark-border text-slate-400 hover:text-white hover:border-slate-600'
                                }`}
                            >
                                {d.name}
                            </button>
                        ))}
                    </div>

                    {/* Search & Filter Form */}
                    <section className="glass-panel p-6 rounded-2xl shadow-2xl mb-8">
                        <form onSubmit={(e) => handleSearch(e)} className="space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                {/* Role / Domain Input */}
                                <div className="md:col-span-5">
                                    <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                                        Role / Discipline
                                    </label>
                                    <input
                                        type="text"
                                        value={role}
                                        onChange={(e) => setRole(e.target.value)}
                                        placeholder="e.g. PCB Design Intern, Embedded Software, Firmware Engineer"
                                        className="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors"
                                        required
                                    />
                                    {/* Preset Pills */}
                                    <div className="flex flex-wrap gap-1.5 mt-2">
                                        {DOMAINS.find(d => d.id === selectedDomain)?.presets.map(p => (
                                            <button
                                                key={p}
                                                type="button"
                                                onClick={() => {
                                                    setRole(p);
                                                    handleSearch(null, p, location, jobType);
                                                }}
                                                className={`text-[11px] px-2.5 py-0.5 rounded-md font-mono transition-colors ${
                                                    role === p
                                                        ? 'bg-blue-600 text-white font-medium'
                                                        : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                                                }`}
                                            >
                                                {p}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Location Input & City Quick Select */}
                                <div className="md:col-span-3">
                                    <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                                        Location
                                    </label>
                                    <input
                                        type="text"
                                        value={location}
                                        onChange={(e) => setLocation(e.target.value)}
                                        placeholder="Hyderabad"
                                        className="w-full bg-dark-input border border-dark-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors font-medium"
                                    />
                                    <div className="flex flex-wrap gap-1 mt-2">
                                        {CITIES.map(c => (
                                            <button
                                                key={c}
                                                type="button"
                                                onClick={() => {
                                                    setLocation(c);
                                                    handleSearch(null, role, c, jobType);
                                                }}
                                                className={`text-[10px] px-1.5 py-0.5 rounded font-mono ${
                                                    location === c ? 'bg-indigo-600 text-white font-bold' : 'bg-slate-800/60 text-slate-400'
                                                }`}
                                            >
                                                {c}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Job Type & Submit */}
                                <div className="md:col-span-4 flex flex-col justify-between">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                                                Job Type
                                            </label>
                                            <select
                                                value={jobType}
                                                onChange={(e) => setJobType(e.target.value)}
                                                className="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500"
                                            >
                                                <option value="Internship">Internship (Paid)</option>
                                                <option value="Full-Time">Full-Time Job</option>
                                                <option value="Entry-Level">Graduate / Trainee</option>
                                                <option value="Any">All Types</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                                                Paid Filter
                                            </label>
                                            <div className="bg-dark-input border border-dark-border rounded-xl px-3 py-2.5 text-xs text-emerald-400 font-semibold flex items-center justify-between">
                                                <span>✓ Verified</span>
                                                <span className="text-[10px] text-emerald-500 font-mono">STIPEND</span>
                                            </div>
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className={`w-full mt-3 py-2.5 px-4 rounded-xl font-bold text-sm text-white flex items-center justify-center gap-2 shadow-lg transition-all ${
                                            loading
                                                ? 'bg-blue-800 cursor-not-allowed opacity-75'
                                                : 'bg-gradient-to-r from-blue-600 via-indigo-600 to-emerald-600 hover:opacity-90 shadow-blue-500/20 active:scale-[0.98]'
                                        }`}
                                    >
                                        {loading ? (
                                            <>
                                                <svg className="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                <span>Scouting Live {jobType}s...</span>
                                            </>
                                        ) : (
                                            <>
                                                <span>🔍</span>
                                                <span>Search {jobType}s</span>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </form>
                    </section>

                    {/* Error Banner */}
                    {error && (
                        <div className="bg-rose-950/80 border border-rose-800 text-rose-200 p-4 rounded-xl mb-8 flex items-start gap-3 text-sm">
                            <span className="text-xl">⚠️</span>
                            <div>
                                <h4 className="font-bold">Search Notice</h4>
                                <p className="text-rose-300 mt-0.5">{error}</p>
                            </div>
                        </div>
                    )}

                    {/* Results Overview Bar */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                        <div className="flex items-center gap-3">
                            <h2 className="text-xl font-bold text-white">
                                Verified {role} Opportunities
                            </h2>
                            <span className="bg-emerald-950 text-emerald-400 font-mono text-xs px-2.5 py-0.5 rounded-full border border-emerald-800/60 font-semibold">
                                {filteredLeads.length} Available
                            </span>
                        </div>

                        {/* Local Search Filter */}
                        <div className="w-full sm:w-64">
                            <input
                                type="text"
                                value={searchFilter}
                                onChange={(e) => setSearchFilter(e.target.value)}
                                placeholder="Filter company, role, location..."
                                className="w-full bg-dark-card border border-dark-border rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
                            />
                        </div>
                    </div>

                    {/* Results Grid */}
                    {loading ? (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            {[1, 2, 3, 4].map(n => (
                                <div key={n} className="bg-dark-card border border-dark-border rounded-2xl p-6 space-y-4">
                                    <div className="flex justify-between items-center">
                                        <div className="h-4 w-28 shimmer rounded"></div>
                                        <div className="h-4 w-20 shimmer rounded"></div>
                                    </div>
                                    <div className="h-6 w-48 shimmer rounded"></div>
                                    <div className="h-4 w-36 shimmer rounded"></div>
                                    <div className="h-16 w-full shimmer rounded-xl"></div>
                                    <div className="h-10 w-full shimmer rounded-xl"></div>
                                </div>
                            ))}
                        </div>
                    ) : filteredLeads.length === 0 ? (
                        <div className="text-center py-16 bg-dark-card border border-dark-border rounded-2xl p-8">
                            <div className="text-4xl mb-3">🔎</div>
                            <h3 className="text-lg font-bold text-slate-200">No matching listings found</h3>
                            <p className="text-sm text-slate-400 mt-1 max-w-md mx-auto">
                                Try picking one of the domain presets (Embedded, PCB, Hardware, AI) or searching for a different city.
                            </p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            {filteredLeads.map((lead, idx) => (
                                <div 
                                    key={idx} 
                                    className="bg-dark-surface border border-dark-border hover:border-blue-500/60 rounded-2xl p-6 flex flex-col justify-between transition-all duration-200 hover:shadow-xl hover:shadow-blue-500/5 group"
                                >
                                    <div>
                                        {/* Card Top Badges */}
                                        <div className="flex items-center justify-between gap-2 mb-3">
                                            <div className="flex items-center gap-2">
                                                <span className="bg-slate-800 text-slate-300 font-mono text-[11px] font-bold px-2 py-0.5 rounded-md">
                                                    #{idx + 1}
                                                </span>
                                                <span className="bg-emerald-950/80 text-emerald-300 border border-emerald-800/60 text-[11px] font-semibold px-2.5 py-0.5 rounded-md flex items-center gap-1">
                                                    <span>💰</span> {lead.paid_source}
                                                </span>
                                            </div>
                                            <span className="bg-blue-950/80 text-blue-300 border border-blue-800/60 text-[11px] font-semibold px-2.5 py-0.5 rounded-md">
                                                📍 {lead.location}
                                            </span>
                                        </div>

                                        {/* Company & Role */}
                                        <h3 className="text-xl font-extrabold text-white group-hover:text-blue-400 transition-colors">
                                            {lead.company}
                                        </h3>
                                        <div className="text-indigo-300 font-semibold text-sm mt-0.5 mb-3">
                                            {lead.role}
                                        </div>

                                        {/* Why It Fits Note */}
                                        <div className="bg-slate-900/80 border-l-2 border-amber-400 rounded-r-xl p-3 text-xs text-slate-300 mb-4 leading-relaxed">
                                            <strong className="text-amber-300 block mb-1">💡 Cold Outreach Strategy:</strong>
                                            {lead.why_it_fits}
                                        </div>

                                        {/* 3-Tier LinkedIn Outreach Targets */}
                                        <div className="space-y-2 mb-5">
                                            <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                                                Direct LinkedIn Points of Contact:
                                            </div>

                                            {/* Tech / Hardware Lead (Top Rec) */}
                                            <div className="bg-dark-card border border-dark-border hover:border-amber-500/40 rounded-xl p-2.5 flex items-center justify-between gap-2">
                                                <div className="truncate">
                                                    <div className="text-[10px] font-bold text-amber-400 uppercase flex items-center gap-1">
                                                        <span>💻 Tech / Engineering Lead</span>
                                                        <span className="bg-amber-400/20 text-amber-300 text-[9px] px-1.5 py-0.2 rounded">Highest Response</span>
                                                    </div>
                                                    <div className="text-xs font-semibold text-slate-200 truncate mt-0.5">
                                                        {lead.contact_name ? `${lead.contact_name} (${lead.contact_title})` : (lead.tech_contact?.split("—")[0] || "Engineering Lead")}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-1.5 shrink-0">
                                                    <a 
                                                        href={lead.contact_linkedin_url && lead.contact_linkedin_url.startsWith("http") ? lead.contact_linkedin_url : (lead.tech_contact?.includes("http") ? lead.tech_contact.split("—")[1]?.trim() : "#")} 
                                                        target="_blank" 
                                                        className="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2.5 py-1 rounded-lg font-medium transition-colors"
                                                    >
                                                        Profile ↗
                                                    </a>
                                                    <button 
                                                        onClick={() => copyPitch('tech', lead.company, lead.role)}
                                                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded-lg transition-colors"
                                                        title="Copy domain-tailored technical pitch"
                                                    >
                                                        Copy Pitch
                                                    </button>
                                                </div>
                                            </div>

                                            {/* HR / Talent */}
                                            <div className="bg-dark-card border border-dark-border rounded-xl p-2.5 flex items-center justify-between gap-2">
                                                <div className="truncate">
                                                    <div className="text-[10px] font-bold text-slate-400 uppercase">
                                                        👤 HR / Recruiter
                                                    </div>
                                                    <div className="text-xs font-semibold text-slate-200 truncate mt-0.5">
                                                        {lead.hr_contact?.split("—")[0] || "Talent Acquisition"}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-1.5 shrink-0">
                                                    <a 
                                                        href={lead.hr_contact?.includes("http") ? lead.hr_contact.split("—")[1]?.trim() : "#"} 
                                                        target="_blank" 
                                                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded-lg font-medium transition-colors"
                                                    >
                                                        LinkedIn ↗
                                                    </a>
                                                    <button 
                                                        onClick={() => copyPitch('hr', lead.company, lead.role)}
                                                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded-lg transition-colors"
                                                    >
                                                        Copy Pitch
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Founder / CEO */}
                                            <div className="bg-dark-card border border-dark-border rounded-xl p-2.5 flex items-center justify-between gap-2">
                                                <div className="truncate">
                                                    <div className="text-[10px] font-bold text-indigo-400 uppercase">
                                                        👔 Founder / CEO
                                                    </div>
                                                    <div className="text-xs font-semibold text-slate-200 truncate mt-0.5">
                                                        {lead.ceo_contact?.split("—")[0] || "Leadership"}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-1.5 shrink-0">
                                                    <a 
                                                        href={lead.ceo_contact?.includes("http") ? lead.ceo_contact.split("—")[1]?.trim() : "#"} 
                                                        target="_blank" 
                                                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded-lg font-medium transition-colors"
                                                    >
                                                        LinkedIn ↗
                                                    </a>
                                                    <button 
                                                        onClick={() => copyPitch('ceo', lead.company, lead.role)}
                                                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded-lg transition-colors"
                                                    >
                                                        Copy Pitch
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Direct Apply Button */}
                                    <a
                                        href={lead.apply_link}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-emerald-600 hover:opacity-90 text-white font-bold py-2.5 px-4 rounded-xl text-center text-sm shadow-md shadow-blue-600/20 transition-all flex items-center justify-center gap-2"
                                    >
                                        <span>🚀</span> Direct Application Portal Link
                                    </a>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
